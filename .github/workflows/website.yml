name: Website CI

# Build validation + Lighthouse audit for the Astro marketing site (heymeld.com).
# Runs on PRs and main pushes whenever website/ or this workflow changes.

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'

  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'

# Cancel any in-flight run for the same workflow + ref. Saves runner
# minutes when a PR pushes new commits faster than CI completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Astro Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      - name: Verify build output exists
        working-directory: website
        # Renamed in the 2026-06-12 honesty sweep. The old name ("Check for
        # broken internal links") claimed a link check that never existed:
        # the step only listed dist/. A real internal link check (e.g.
        # lychee --offline against dist/) is a welcome follow-up, added as a
        # NEW honestly named step and verified on a PR that actually
        # triggers this workflow.
        run: |
          ls -la dist/
          echo "Build output present"

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: website/lighthouserc.json
          uploadArtifacts: true
        continue-on-error: true  # Advisory for now; promote to hard gate after baselines
