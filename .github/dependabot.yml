# Dependabot: automated dependency vulnerability scanning.
# Creates PRs for security updates across all three ecosystems.

version: 2
updates:
  # Python backend (pip/uv)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0   # PAUSED 2026-09-08 (automation audit): was 5; 0 stops version-update PRs
    labels:
      - "type/maintenance"
      - "source/routine"
    commit-message:
      prefix: "deps(backend):"

  # Astro website (npm)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0   # PAUSED 2026-09-08 (automation audit): was 3; 0 stops version-update PRs
    labels:
      - "type/maintenance"
      - "source/routine"
    commit-message:
      prefix: "deps(website):"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0   # PAUSED 2026-09-08 (automation audit): was 3; 0 stops version-update PRs
    labels:
      - "type/maintenance"
    commit-message:
      prefix: "deps(actions):"

  # Backend Dockerfile (Python base + uv pin)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0   # PAUSED 2026-09-08 (automation audit): was 3; 0 stops version-update PRs
    labels:
      - "type/maintenance"
    commit-message:
      prefix: "deps(docker):"
