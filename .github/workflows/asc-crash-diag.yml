name: ASC Crash Diagnostics (manual)

# One-off, manual-only diagnostic. Mints an App Store Connect API JWT from the
# same secrets testflight.yml uses (APP_STORE_CONNECT_API_KEY_CONTENT base64 of
# the .p8, _ID = kid, _ISSUER_ID = iss) and queries the read-only diagnostics
# endpoints for the Meld app, to check whether the issue #199 launch crash
# (NotificationService.getPermissionStatus -> dispatch_assert_queue ->
# EXC_BREAKPOINT) shows up in production TestFlight builds. Read-only; never
# writes. The .p8 stays inside the runner. Apple's public API exposes
# diagnosticSignatures (disk/hangs) + perfPowerMetrics but historically not a
# clean crash-group endpoint, so this confirms the build/exposure history and
# probes for the signature; Xcode Organizer remains authoritative for an exact
# crash count.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      BUNDLE_ID: com.heymeld.app
    steps:
      - name: Set up Python + deps
        run: |
          python3 -m pip install --quiet pyjwt cryptography requests

      - name: Query ASC diagnostics
        run: |
          if [ -z "$ASC_KEY_CONTENT" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::Missing App Store Connect secrets."
            exit 1
          fi
          echo "$ASC_KEY_CONTENT" | base64 --decode > /tmp/AuthKey.p8
          cat > /tmp/asc.py <<'PY'
          import os, time, json, base64
          import jwt, requests

          KID = os.environ["ASC_KEY_ID"]
          ISS = os.environ["ASC_ISSUER_ID"]
          BUNDLE = os.environ["BUNDLE_ID"]
          KEY = open("/tmp/AuthKey.p8").read()
          BASE = "https://api.appstoreconnect.apple.com"

          def token():
              now = int(time.time())
              return jwt.encode(
                  {"iss": ISS, "iat": now, "exp": now + 1000, "aud": "appstoreconnect-v1"},
                  KEY, algorithm="ES256", headers={"kid": KID, "typ": "JWT"})

          S = requests.Session()
          S.headers.update({"Authorization": f"Bearer {token()}"})

          def get(path, **params):
              url = path if path.startswith("http") else BASE + path
              r = S.get(url, params=params or None, timeout=30)
              return r.status_code, (r.json() if r.headers.get("content-type","").startswith("application/json") else {"_text": r.text[:500]})

          MARKERS = ["dispatch_assert_queue", "getPermissionStatus", "UNUserNotification",
                     "isCurrentExecutor", "EXC_BREAKPOINT", "_dispatch_assert_queue_fail",
                     "NotificationService"]

          print("=== Resolve app id for", BUNDLE, "===")
          sc, app = get("/v1/apps", **{"filter[bundleId]": BUNDLE, "fields[apps]": "bundleId,name"})
          print("status", sc)
          data = app.get("data", [])
          if not data:
              print("No app found. Raw:", json.dumps(app)[:800]); raise SystemExit(0)
          app_id = data[0]["id"]
          print("app_id =", app_id, "name =", data[0]["attributes"].get("name"))

          print("\n=== Builds (exposure history) ===")
          sc, builds = get(f"/v1/builds", **{"filter[app]": app_id, "limit": 200, "sort": "-uploadedDate",
                            "fields[builds]": "version,uploadedDate,processingState,expired"})
          print("status", sc)
          blist = builds.get("data", [])
          print(f"{len(blist)} builds returned")
          rows = []
          for b in blist:
              a = b["attributes"]
              rows.append((b["id"], a.get("version"), a.get("uploadedDate"), a.get("processingState"), a.get("expired")))
          for bid, ver, up, st, exp in rows:
              print(f"  build {ver:<6} uploaded {str(up):<26} state={st} expired={exp} id={bid}")

          # Probe diagnostics for each build (newest first); stop printing detail after we cover the window.
          print("\n=== Diagnostic signatures + perfPowerMetrics per build ===")
          hit_any = False
          for bid, ver, up, st, exp in rows:
              sc_ds, ds = get(f"/v1/builds/{bid}/diagnosticSignatures", **{"limit": 200})
              sigs = ds.get("data", []) if isinstance(ds, dict) else []
              sc_pp, pp = get(f"/v1/builds/{bid}/perfPowerMetrics")
              pp_cats = []
              if isinstance(pp, dict):
                  for prod in pp.get("data", []) if "data" in pp else []:
                      pass
                  # perfPowerMetrics returns productData list with metricCategories
                  for d in (pp.get("data") or []):
                      mc = d.get("attributes", {}).get("metricCategory")
                      if mc: pp_cats.append(mc)
              line = f"  build {ver:<6} diagnosticSignatures: status={sc_ds} count={len(sigs)}"
              line += f" | perfPowerMetrics: status={sc_pp} categories={sorted(set(pp_cats)) or '-'}"
              print(line)
              for s in sigs:
                  at = s.get("attributes", {})
                  dtype = at.get("diagnosticType"); sig = at.get("signature",""); weight = at.get("weight")
                  blob = json.dumps(at)
                  marker = next((m for m in MARKERS if m.lower() in blob.lower()), None)
                  if marker or dtype not in ("DISK_WRITES",):
                      print(f"      - type={dtype} weight={weight} sig={str(sig)[:80]} marker={marker}")
                  # pull sample logs and scan for the crash markers
                  sc_lg, lg = get(f"/v1/diagnosticSignatures/{s['id']}/logs", **{"limit": 10})
                  txt = json.dumps(lg)
                  found = [m for m in MARKERS if m.lower() in txt.lower()]
                  if found:
                      hit_any = True
                      print(f"        !!! LOG MATCH on signature {s['id']}: {found}")
                      print("        ", txt[:600])
          print("\n=== RESULT ===")
          print("Crash-signature markers found in diagnostic logs:", "YES" if hit_any else "NO (API may not expose crash groups; check Xcode Organizer)")
          PY
          python3 /tmp/asc.py
          rm -f /tmp/AuthKey.p8 /tmp/asc.py
