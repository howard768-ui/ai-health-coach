name: iOS CI

# P2-13: Build + test the Meld iOS app on every PR/main push.
# Uses xcodegen to regenerate the project, then xcodebuild for build + tests.

on:
  pull_request:
    paths:
      - 'Meld/**'
      - 'MeldTests/**'
      - 'MeldSnapshotTests/**'
      - 'MeldUITests/**'
      - 'MeldNotificationServiceExtension/**'
      - 'maestro/**'
      - 'project.yml'
      - '.github/workflows/ios.yml'

  push:
    branches: [main]
    paths:
      - 'Meld/**'
      - 'MeldTests/**'
      - 'MeldSnapshotTests/**'
      - 'MeldUITests/**'
      - 'MeldNotificationServiceExtension/**'
      - 'maestro/**'
      - 'project.yml'
      - '.github/workflows/ios.yml'

  workflow_dispatch:

# Cancel any in-flight run for the same workflow + ref, but only for PRs.
# Saves runner minutes when a PR pushes new commits faster than CI completes.
# On main, successive auto-merges share the same ref, so cancel-in-progress
# was killing every in-flight main run before its Maestro job finished:
# 2 of the 3 main-push iOS runs around 2026-06-09 ended "cancelled" and main
# had no completed E2E verification at all. Main runs now queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: xcodebuild + test
    # macOS-15 ships Xcode 16.x which matches our project.yml xcodeVersion.
    runs-on: macos-15
    # Bumped from 30 to 45. The `-test-iterations 2 -retry-tests-on-failure`
    # pattern added in PR #52 to dodge the macos-15 RunningBoard flake can
    # push total job time to ~30 min when the first iteration hits the
    # race. Observed on PR #53 validation (2026-04-20): 30m54s, cancelled
    # by timeout with Test (UI) still in a retry iteration. 45 min gives
    # clean headroom for build (~2m) + unit (~1m) + pre-warm (~10s) +
    # up to two ~20 min UI iterations.
    timeout-minutes: 45

    env:
      SCHEME: Meld
      # Picks an iOS Simulator that the runner image has installed. macos-15
      # comes with iOS 18 simulators by default.
      DESTINATION: 'platform=iOS Simulator,name=iPhone 16 Pro'

    steps:
      - uses: actions/checkout@v6

      - name: Show available Xcode versions
        run: |
          ls /Applications | grep -i Xcode || true
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Regenerate project
        # project.yml is the source of truth — checked-in .xcodeproj is just
        # a snapshot. Regenerating in CI catches drift and avoids merge
        # conflicts in pbxproj.
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project Meld.xcodeproj \
            -scheme "$SCHEME" \
            -resolvePackageDependencies

      - name: Build
        # `|| true` was hiding real Swift compile errors behind a green
        # checkmark. Removed so build failures actually fail the step.
        # `set -o pipefail` propagates xcodebuild's exit code past xcpretty.
        run: |
          set -o pipefail
          # tee the raw xcodebuild stream to a file BEFORE xcpretty. xcpretty
          # silently drops most per-file diagnostics on the macos-15 runner
          # (an internal parse error kills its output), so the raw log is the
          # only reliable record of compile/test failures. Uploaded by the
          # "Upload raw xcodebuild logs" step on failure.
          xcodebuild \
            -project Meld.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-build.log" | xcpretty

      # Hand the freshly built .app to the Maestro job so it stops rebuilding
      # the identical bundle from scratch (10 to 13.5 min observed per run,
      # 42-44% of the old Maestro job budget). ditto is mandatory: zipping
      # through upload-artifact directly strips executable bits and symlinks
      # from .app bundles, producing an uninstallable app.
      - name: Package app for E2E (Maestro)
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -name "Meld.app" \
            -path "*/Debug-iphonesimulator/*" \
            -not -path "*.xctest/*" \
            -not -path "*-Runner.app/*" \
            | head -1)
          echo "Packaging: $APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Meld-app.zip"

      - name: Upload app for E2E (Maestro)
        uses: actions/upload-artifact@v7
        with:
          name: meld-app-sim
          path: ${{ runner.temp }}/Meld-app.zip
          retention-days: 2

      # Split test invocations by target type because they need different
      # signing settings and have different failure modes. Running them in
      # one `xcodebuild test` masked which target was breaking — the
      # per-suite summaries from xcpretty were getting swallowed when any
      # target hit exit 65.
      #
      # Unit + snapshot tests run INSIDE the Meld.app test host. They must
      # be ad-hoc signed (CODE_SIGN_IDENTITY="-"), NOT built with
      # CODE_SIGNING_ALLOWED=NO: an unsigned test host has no
      # application-identifier entitlement, so the simulator keychain has no
      # access group and every SecItem call returns errSecMissingEntitlement
      # (-34018). That broke all KeychainStore + AuthManager tests (27 of
      # 111) silently from 2026-05-03 until the iOS gate was added. Ad-hoc
      # signing applies the entitlements and gives the keychain a valid
      # access group on the simulator (the same config the UI test step
      # already uses). Any snapshot-tests failure uploads diff PNGs via the
      # Upload snapshot failures step at the end of this job.

      - name: Test (unit)
        # MeldSnapshotTests is deliberately NOT run here. The ~50 committed
        # reference PNGs under MeldSnapshotTests/__Snapshots__/ were
        # rendered on a different simulator/macOS combination than the
        # macos-15 / iOS 18.5 CI runner, so every snapshot diff fails on
        # CI while passing locally. This is the "iOS snapshot baselines
        # deferred (need Mac xcodebuild)" note from project memory. Run
        # snapshot tests locally until we have a baseline strategy
        # (dedicated regeneration job, or a snapshot infra like
        # fastlane-snapshot + uploaded baselines).
        run: |
          set -o pipefail
          xcodebuild \
            -project Meld.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            -only-testing:MeldTests \
            -skip-testing:MeldSnapshotTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test-unit.log" | xcpretty --test --color

      # Pre-warm the simulator before the UI test to dodge the macos-15 +
      # iOS 18 RunningBoard race. Symptom on a cold boot: xctrunner asks
      # RBS for a background assertion on the SUT pid, but runningboardd
      # has not yet registered the process, so the assertion call returns
      # "Failed to get background assertion for target app with pid X"
      # (or pid 0 if the process never registered at all). Booting the
      # device + waiting for bootstatus + giving SpringBoard a moment to
      # settle eliminates the race window.
      #
      # Refs:
      # - actions/runner-images#12862, #12777, #12948 (macos-15 sim flake)
      # - Apple Forums 813260 (iOS 18 accessibility load race)
      # - cordova-ios#1103 (RBS background assertion same error string)
      - name: Pre-warm simulator for UI tests
        id: prewarm
        run: |
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep "iPhone 16 Pro (" \
            | head -1 \
            | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::Could not find iPhone 16 Pro simulator UDID"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Booting simulator $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          # Let SpringBoard + runningboardd finish registration before
          # xctrunner attaches. 8s is empirically enough on macos-15.
          sleep 8
          xcrun simctl list devices booted
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      # UI tests spawn Meld.app as a separate process via XCUIApplication,
      # which the simulator's xctrunner refuses to launch when the bundle
      # is entirely unsigned. Ad-hoc identity ("-") works without a real
      # developer certificate.
      #
      # `-test-iterations 2 -retry-tests-on-failure` is Xcode-native: if
      # the runner still hits the RBS race despite the pre-warm above,
      # xcodebuild re-spawns xctrunner cleanly for a second attempt
      # before reporting failure. Belt-and-suspenders against the flake.
      - name: Test (UI)
        run: |
          set -o pipefail
          xcodebuild \
            -project Meld.xcodeproj \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.prewarm.outputs.device_id }}" \
            -configuration Debug \
            -only-testing:MeldUITests \
            -test-iterations 2 \
            -retry-tests-on-failure \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test-ui.log" | xcpretty --test --color

      - name: Upload raw xcodebuild logs
        # always() so we capture the raw stream even when xcpretty greens a
        # step it mis-parsed. These plain-text logs contain the actual
        # compile errors and per-test failures that xcpretty drops.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-raw-logs
          path: |
            ${{ runner.temp }}/xcodebuild-*.log
          if-no-files-found: ignore

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-logs
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore

      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures
          path: |
            **/MeldSnapshotTests/__Snapshots__/**/*.png
          if-no-files-found: ignore

  maestro:
    name: Maestro E2E
    needs: build-and-test
    runs-on: macos-15
    # Restructured 2026-06-12 after every run at the 16-flow count was being
    # cancelled at the old 40-minute ceiling (setup alone ate 16m42s-17m41s,
    # and a healthy full suite needed 26m10s of flow time on top: best case
    # ~43 min, so the ceiling was mathematically unreachable). Changes:
    #   1. The app bundle is downloaded from the build-and-test job instead
    #      of being rebuilt here (saves 10 to 13.5 min per run).
    #   2. Only maestro/flows/smoke/ (UI-local flows) runs in CI. The
    #      backend-data flows live in maestro/flows/backend/ and stay
    #      quarantined until CI has a seeded local backend. See
    #      maestro/README.md.
    #   3. `|| true` is gone: assertion failures now fail this job. Maestro
    #      E2E is NOT in the auto-merge gate's REQUIRED set, so this cannot
    #      block or slow Tier 0 auto-merges; it is honest signal only.
    #      Previously a run where the iOS driver timed out and ZERO flows
    #      executed reported green (runs 27218539765 / 27224907237).
    # Budget: download+unpack ~2m, boot+install ~2m, driver startup up to 5m,
    # 10 smoke flows ~12-15m, headroom for the 4-6x macos-15 runner variance.
    timeout-minutes: 30

    env:
      # The Maestro iOS driver's default startup wait is shorter than what a
      # loaded macos-15 runner needs: two June 9 runs aborted with
      # IOSDriverTimeoutException before any flow ran. 5 minutes of headroom.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
      MAESTRO_CLI_NO_ANALYTICS: "1"

    steps:
      - uses: actions/checkout@v6

      - name: Install Maestro
        # Pinned: the unpinned installer drifts (cli-2.6.1 shipped mid-debug
        # on 2026-06-12, changing driver failure timing between consecutive
        # runs of the same workflow). Bump deliberately.
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.6.1 bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Download app from build-and-test
        uses: actions/download-artifact@v8
        with:
          name: meld-app-sim
          path: ${{ runner.temp }}/e2e-app

      - name: Unpack app
        run: |
          ditto -x -k "$RUNNER_TEMP/e2e-app/Meld-app.zip" "$RUNNER_TEMP/e2e-app"
          ls "$RUNNER_TEMP/e2e-app"

      # Same prewarm pattern as the UI-test step in build-and-test: boot by
      # UDID, wait for bootstatus, give SpringBoard time to settle. The old
      # bare `simctl boot || true` here did not wait, which contributed to
      # the driver startup races.
      - name: Boot Simulator
        id: prewarm
        run: |
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep "iPhone 16 Pro (" \
            | head -1 \
            | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::Could not find iPhone 16 Pro simulator UDID"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Booting simulator $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          sleep 8
          xcrun simctl list devices booted
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Install app
        run: |
          APP_PATH="$RUNNER_TEMP/e2e-app/Meld.app"
          echo "Installing: $APP_PATH"
          # Sanity-check Info.plist so the CI log points at the root cause
          # if the artifact ever regresses, rather than a cryptic simctl error.
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          xcrun simctl install "${{ steps.prewarm.outputs.device_id }}" "$APP_PATH"

      - name: Run Maestro flows (smoke set)
        # Step-level timeout, NOT just the job-level one: when the job-level
        # timeout fires, GitHub hard-kills the runner and the always() upload
        # steps below never execute, which is how the 2026-06-10 incident lost
        # every artifact. A step timeout kills only this step, so the junit
        # and debug output survive for post-mortem.
        timeout-minutes: 20
        run: |
          # --debug-output dumps per-flow accessibility trees + screenshots
          # so post-mortem artifact inspection can tell us what the
          # screen actually looked like when an assertion failed. This
          # is the diagnostic path for the PR #51 tab-bar regression.
          maestro test maestro/flows/smoke/ \
            --format junit \
            --output maestro-results.xml \
            --debug-output maestro-debug/

      - name: Pull auth-debug.txt from simulator
        # failure() not always(): on green runs these diagnostics added
        # ~4.5 min of macOS runner time for nothing.
        if: failure()
        run: |
          # MeldApp writes this file at boot inside #if DEBUG with the
          # state of its isUITesting flag + launch args + UserDefaults.
          # If the flag is false, auth bypass didn't activate and the
          # user is stuck on the Welcome screen (which is why tab-home
          # never becomes visible).
          set +e
          CONTAINER=$(xcrun simctl get_app_container booted com.heymeld.app data 2>/dev/null)
          if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/auth-debug.txt" ]; then
            echo "=== auth-debug.txt from simulator ==="
            cat "$CONTAINER/Documents/auth-debug.txt"
            echo "=== end ==="
            cp "$CONTAINER/Documents/auth-debug.txt" auth-debug.txt
          else
            echo "::warning::auth-debug.txt not found in simulator container"
          fi

      - name: Diagnostic snapshot (a11y hierarchy + screenshot)
        if: failure()
        run: |
          # --debug-output didn't produce files on the previous PR #55 run,
          # so grab the state directly. Launch the app fresh with the same
          # auth-bypass args Maestro uses, wait for the UI to settle, then
          # dump the accessibility tree + a PNG screenshot.
          set +e
          echo "=== Check if maestro-debug/ was written (from --debug-output) ==="
          find maestro-debug/ -type f 2>/dev/null | head -20 \
            || echo "maestro-debug/ empty or absent"

          echo "=== Terminate any running app instance ==="
          xcrun simctl terminate booted com.heymeld.app 2>/dev/null
          sleep 1

          echo "=== Launch fresh with auth-bypass ==="
          xcrun simctl launch booted com.heymeld.app -uitesting-skip-auth true

          # Wait for SwiftUI to render + any ambient animations to settle.
          sleep 10

          echo "=== Screenshot current screen ==="
          xcrun simctl io booted screenshot diag-screen-after-bypass.png
          ls -la diag-screen-after-bypass.png

          echo "=== Dump accessibility hierarchy via Maestro ==="
          maestro hierarchy > diag-hierarchy.json 2>&1
          wc -l diag-hierarchy.json

          echo "=== Head of hierarchy (first 100 lines) ==="
          head -100 diag-hierarchy.json

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results
          path: maestro-results.xml
          # error, not ignore: a "green" run that produced no junit means the
          # driver never ran a flow. `ignore` hid exactly that for two runs
          # on 2026-06-09.
          if-no-files-found: error

      - name: Bundle Maestro debug output
        if: always()
        run: |
          # Two reasons to tar instead of uploading maestro-debug/ directly:
          # 1. Maestro's real per-flow logs live in maestro-debug/.maestro/,
          #    a hidden dir upload-artifact silently drops by default (that
          #    left the 2026-06-10 11-minute permission hang with zero
          #    surviving driver logs).
          # 2. Maestro names per-flow debug files after flow display names,
          #    which can contain characters upload-artifact rejects: the
          #    colon in "Tab Bar IA: 5 tabs..." failed the first run of the
          #    repaired job. A tarball is immune to flow naming.
          if [ -d maestro-debug ]; then
            tar -czf maestro-debug.tgz maestro-debug/
            ls -la maestro-debug.tgz
          else
            echo "maestro-debug/ absent; nothing to bundle"
          fi

      - name: Upload Maestro debug (screenshots + a11y dumps)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug
          path: |
            maestro-debug.tgz
            auth-debug.txt
            diag-screen-after-bypass.png
            diag-hierarchy.json
          if-no-files-found: ignore

  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        # Don't fail the build on lint warnings — we haven't established a
        # baseline yet. This will become blocking once the codebase is clean.
        run: |
          swiftlint --reporter github-actions-logging Meld/ MeldTests/ MeldSnapshotTests/ || \
            echo "::warning::SwiftLint found issues"
