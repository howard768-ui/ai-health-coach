name: HITL Classifier

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Tier 3 change, Brock-approved 2026-06-12 (vault: "Tier 3 Proposal -
  # Auto-merge Event Trigger and Review Gate"). The 30-minute poll below
  # cannot outlast iOS CI (~35 min when unqueued; macOS queueing observed
  # 1h15m to 18.5h), so every green iOS PR used to time out and need a
  # manual merge. Completed CI now re-fires the classifier, which finds all
  # checks already done and resolves in one poll iteration. Classification
  # semantics, kill switch, REQUIRED list, and merge mechanics are
  # unchanged; only the trigger and PR-context resolution are new.
  workflow_run:
    workflows: ["iOS CI", "Backend CI", "Claude Code Review"]
    types: [completed]

permissions:
  # `contents: write` is needed for `gh pr merge --merge` on the Tier 0
  # path. Without it GitHub rejects with
  # `Resource not accessible by integration (mergePullRequest)`.
  contents: write
  pull-requests: write
  issues: write

jobs:
  classify:
    name: Classify PR tier
    runs-on: ubuntu-latest
    # Skip dependabot (handled by dependabot-automerge.yml) and fork PRs
    # (safety). github.event.pull_request is absent on workflow_run events,
    # so the condition branches by event type; the workflow_run arm only
    # re-attempts after SUCCESSFUL workflow completions (a failed workflow
    # would just make the poll abort anyway).
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.actor.login != 'dependabot[bot]' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    steps:
      - name: Kill switch check
        id: killswitch
        env:
          AUTO_MERGE_ENABLED: ${{ vars.AUTO_MERGE_ENABLED }}
        run: |
          if [ "${AUTO_MERGE_ENABLED}" != "true" ]; then
            echo "AUTO_MERGE_ENABLED=${AUTO_MERGE_ENABLED:-unset}; skipping classifier."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PR context
        # On pull_request events this is a passthrough. On workflow_run
        # events the payload has no PR object, so resolve it: head SHA from
        # the completed run, then the PR via the commits-to-pulls API. Only
        # OPEN PRs proceed; a main-push completion resolves to the already
        # merged (closed) PR and exits here, as does any run whose branch
        # has no PR.
        if: steps.killswitch.outputs.enabled == 'true'
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "pr_num=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          PR_JSON=$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.state == "open")][0] // empty')
          if [ -z "$PR_JSON" ]; then
            echo "No open PR for ${HEAD_SHA} (main push or closed PR); nothing to re-attempt."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_NUM=$(echo "$PR_JSON" | jq -r '.number')
          BASE_SHA=$(echo "$PR_JSON" | jq -r '.base.sha')
          PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.user.login')
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "PR #${PR_NUM} is dependabot's; dependabot-automerge.yml owns it."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Re-attempt for PR #${PR_NUM} at ${HEAD_SHA} (triggered by completed '${{ github.event.workflow_run.name }}')."
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "pr_num=${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.killswitch.outputs.enabled == 'true' && steps.ctx.outputs.proceed == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute diff file list
        if: steps.killswitch.outputs.enabled == 'true' && steps.ctx.outputs.proceed == 'true'
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.ctx.outputs.pr_num }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "/repos/${REPO}/pulls/${PR_NUM}/files" --jq '.[].filename' > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Classify changes
        if: steps.killswitch.outputs.enabled == 'true' && steps.ctx.outputs.proceed == 'true'
        id: classify
        run: python3 .github/scripts/hitl_classify.py
        env:
          BASE_SHA: ${{ steps.ctx.outputs.base_sha }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}

      - name: Tier 3, block and close
        # pull_request events only: a workflow_run re-attempt on a Tier 3 PR
        # must not re-comment or re-close; the original pull_request run
        # already did.
        if: github.event_name == 'pull_request' && steps.killswitch.outputs.enabled == 'true' && steps.classify.outputs.tier == 'tier3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.ctx.outputs.pr_num }}
          REASONS: ${{ steps.classify.outputs.reasons }}
          MATCHED: ${{ steps.classify.outputs.matched_files }}
        run: |
          BODY=$(printf '### Tier 3 BLOCKED\n\nThis PR touches paths or content classified as Tier 3 (safety / encryption / evidence-bound prompt / PHI / credentials). These changes must be authored by Brock and cannot be auto-merged or auto-drafted.\n\n**Matched:**\n%s\n\n**Details:**\n%s\n\nClosing this PR. If this is a false positive, edit `.github/hitl-config.json` and reopen.' "$MATCHED" "$REASONS")
          gh pr comment "$PR_NUM" --body "$BODY"
          gh pr close "$PR_NUM"

      - name: Tier 2, label + comment (soft signal to Brock)
        # pull_request events only: workflow_run re-attempts would duplicate
        # the label-and-comment on every completed CI workflow (3+ per PR).
        if: github.event_name == 'pull_request' && steps.killswitch.outputs.enabled == 'true' && steps.classify.outputs.tier == 'tier2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.ctx.outputs.pr_num }}
          REASONS: ${{ steps.classify.outputs.reasons }}
          MATCHED: ${{ steps.classify.outputs.matched_files }}
        run: |
          # Ensure label exists, then apply it. The label is the gate: the
          # Tier 0 auto-merge path only runs when tier == 'tier0', so a PR
          # classified as Tier 2 will NOT be auto-merged by this workflow.
          gh label create product-review --color FBCA04 --description "Tier 2: needs Brock's product review" 2>/dev/null || true
          gh pr edit "$PR_NUM" --add-label product-review

          BODY=$(printf '### Tier 2 PRODUCT, Brock reviews\n\nThis PR touches paths classified as Tier 2 (coach / chat_stream / design tokens / onboarding / website content). These have product surface implications and will not be auto-merged by the HITL classifier.\n\n**Matched files:**\n%s\n\n**Why:**\n%s\n\nBrock reviews, Claude executes the merge on his approval. The `product-review` label is the signal; the PR stays in its current draft/ready state (GITHUB_TOKEN cannot convert to draft without an app token, so we rely on the label instead).\n\nLinear issue creation will be handled by the Linear MCP from a separate scheduled task.' "$MATCHED" "$REASONS")
          gh pr comment "$PR_NUM" --body "$BODY"

      - name: Tier 0, wait for required checks, then auto-merge
        # Runs on BOTH event types: this is the step the workflow_run
        # re-attempt exists for. On a re-attempt all required checks are
        # typically already complete, so the poll resolves in one iteration.
        if: steps.killswitch.outputs.enabled == 'true' && steps.ctx.outputs.proceed == 'true' && steps.classify.outputs.tier == 'tier0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.ctx.outputs.pr_num }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Classified as Tier 0 engineering. Waiting for Claude PR Review and Backend CI checks to succeed."

          # Poll check-runs for the head SHA until the required checks report
          # SUCCESS, or bail after ~30 minutes.
          #
          # Check-run names must match the `name:` field of the CheckRun entity
          # returned by the check-runs API, NOT the workflow name. Previously
          # this listed "Backend CI" (the workflow name) which never matched
          # any check-run and caused the classifier to hang 30 minutes on
          # every Tier 0 PR. Use the actual job-level check-run names:
          #   - "Claude PR Review"  (from workflow: Claude Code Review)
          #   - "pytest + ML gates + alembic round-trip"  (from workflow: Backend CI)
          # Ruff and type-imports checks are advisory; not in REQUIRED.
          REQUIRED=("Claude PR Review" "pytest + ML gates + alembic round-trip")

          # iOS build gate: when a PR touches iOS sources, the iOS build+test
          # must also pass before auto-merge. ios.yml is path-filtered, so on
          # backend-only PRs the "xcodebuild + test" check-run never appears;
          # requiring it unconditionally would hang every backend PR until the
          # 30-minute timeout. Mirror ios.yml's path filter and only add the
          # requirement when iOS sources actually changed.
          #
          # Closes the gap that let iOS CI stay red from 2026-05-03 onward: the
          # iOS build was never a merge gate, so PRs with a broken iOS build
          # auto-merged on backend + review green alone.
          CHANGED_FILES=$(gh pr view "$PR_NUM" --json files --jq '.files[].path')
          if echo "$CHANGED_FILES" | grep -qE '^(Meld/|MeldTests/|MeldSnapshotTests/|MeldUITests/|MeldNotificationServiceExtension/|maestro/|project\.yml$|\.github/workflows/ios\.yml$)'; then
            echo "PR touches iOS sources; requiring 'xcodebuild + test' before merge."
            REQUIRED+=("xcodebuild + test")
          fi

          DEADLINE=$(( $(date +%s) + 1800 ))

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            RUNS=$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/check-runs" --paginate --jq '.check_runs[] | {name: .name, status: .status, conclusion: .conclusion}')
            all_ok=true
            for name in "${REQUIRED[@]}"; do
              status_line=$(echo "$RUNS" | jq -r --arg n "$name" 'select(.name == $n) | "\(.status)/\(.conclusion)"' | tail -n 1)
              if [ -z "$status_line" ]; then
                echo "Check '$name' not reported yet."
                all_ok=false
                break
              fi
              case "$status_line" in
                completed/success)
                  echo "Check '$name' = success."
                  ;;
                completed/failure|completed/cancelled|completed/timed_out|completed/action_required)
                  echo "Check '$name' failed ($status_line). Aborting auto-merge."
                  exit 0
                  ;;
                *)
                  echo "Check '$name' still running ($status_line)."
                  all_ok=false
                  break
                  ;;
              esac
            done
            if [ "$all_ok" = "true" ]; then
              # Direct merge, not --auto. Auto-merge requires the repo-level
              # "Allow auto-merge" setting to be enabled AND calls
              # enablePullRequestAutoMerge via GraphQL, which GITHUB_TOKEN
              # does not have scope for by default. Since we just polled
              # for all required checks to be SUCCESS, we can merge directly.
              echo "All required checks green; merging directly."
              # Idempotent merge: with the workflow_run re-attempt trigger,
              # two classifier runs can legitimately race to this line (the
              # original poll catching green at the same moment as a
              # re-attempt). Losing the race is success, not failure.
              if ! gh pr merge "$PR_NUM" --merge; then
                STATE=$(gh pr view "$PR_NUM" --json state --jq .state)
                if [ "$STATE" = "MERGED" ]; then
                  echo "PR already merged by a concurrent classifier run."
                  exit 0
                fi
                echo "Merge failed and PR state is ${STATE}."
                exit 1
              fi

              # Post-merge fan-out for push-triggered workflows.
              #
              # GitHub deliberately suppresses workflow runs for push events
              # authored by GITHUB_TOKEN — see
              # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
              # ("events triggered by the GITHUB_TOKEN ... will not create a
              # new workflow run"). That means auto-merged PRs never fire
              # `on: push: branches: [main]` workflows like TestFlight
              # Release, even when their path filter matches.
              #
              # Workaround: from inside this auto-merge step, manually
              # dispatch the iOS-touching workflow when the merged PR
              # actually touched iOS sources. Mirrors the testflight.yml
              # path filter so backend-only or website-only PRs don't
              # burn macOS-runner minutes.
              #
              # Long-term fix is a fine-grained PAT in `AUTOMERGE_PAT` so
              # the merge commit's push event fires normally (no fan-out
              # needed). When that secret exists, drop this whole block.
              echo "Checking whether to fan out TestFlight Release."
              CHANGED=$(gh pr view "$PR_NUM" --json files --jq '.files[].path')
              if echo "$CHANGED" | grep -qE '^(Meld/|Meld\.xcodeproj/|MeldNotificationServiceExtension/|project\.yml$|\.github/workflows/testflight\.yml$)'; then
                echo "iOS sources touched — dispatching TestFlight Release."
                gh workflow run "TestFlight Release" --ref main \
                  || echo "WARN: failed to dispatch TestFlight Release; check manually."
              else
                echo "No iOS-source changes — skipping TestFlight dispatch."
              fi
              exit 0
            fi
            sleep 30
          done

          echo "Timed out waiting for required checks after 30 minutes."
          echo "Benign with the workflow_run trigger: when the slow workflow (usually iOS CI) completes, its completion event re-fires this classifier and the re-attempt merges in one poll iteration."
